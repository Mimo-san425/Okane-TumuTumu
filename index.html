<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コインつなぎ 2つのゲーム</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg{-webkit-user-drag:none;user-drag:none}
body{margin:0;background:#10213c;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}
.app{max-width:680px;margin:auto;padding:12px}
.stats{display:flex;justify-content:space-around;background:#254569;border-radius:14px;padding:10px;text-align:center}
.num{font-size:30px;font-weight:900}
.mode-label{text-align:center;margin-top:8px;font-size:15px;font-weight:800;color:#dce9ff}
.board{position:relative;width:100%;aspect-ratio:8/9;background:radial-gradient(#345b88,#122947);border:3px solid #779ac0;border-radius:15px;touch-action:none;overflow:hidden;margin-top:8px}
.coin{position:absolute;width:11.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 5px #0006;background-size:cover!important;background-position:center!important;border:0!important}
.coin.v1{background-image:url("assets/1.png")!important}.coin.v5{background-image:url("assets/5.png")!important}.coin.v10{background-image:url("assets/10.png")!important}.coin.v50{background-image:url("assets/50.png")!important}.coin.v100{background-image:url("assets/100.png")!important}.coin.v500{background-image:url("assets/500.png")!important}
.coin.hint{box-shadow:0 0 0 4px #a7ff85,0 0 22px 7px #8eff69,inset 2px 2px 4px #fff9;animation:pulse .7s infinite alternate}
.coin.sel{z-index:2;box-shadow:0 0 0 4px #ffdf45,0 0 19px #ffdf45;transform:translate(-50%,-50%) scale(1.12)}
@keyframes pulse{to{filter:brightness(1.45)}}
button{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:20px;color:#302509;cursor:pointer}
.overlay{position:absolute;inset:0;background:#071629f2;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:18px}
.overlay h1{font-size:34px;margin:0}.overlay .big{font-size:48px;font-weight:900;color:#ffdf55}.hidden{display:none!important}
.mode-buttons{display:grid;grid-template-columns:1fr;gap:12px;width:min(92%,420px)}
.mode-btn{background:#ffd54c}.mode-btn.second{background:#9de2ff;color:#12324c}.again-btn{background:#ffd54c}.menu-btn{background:#dce9ff;color:#17314f;font-size:17px;padding:10px 18px}
.rule{font-size:14px;line-height:1.5;font-weight:700}
.msg{text-align:center;min-height:28px;font-weight:bold;margin-top:10px}.guide{text-align:center;font-size:13px;color:#dce9ff;margin:10px 0;line-height:1.7}
.lesson{position:absolute;z-index:4;top:25%;left:4%;width:92%;padding:14px 8px;background:#fffdf1f5;color:#182b46;border:4px solid #ffd34e;border-radius:20px;text-align:center;pointer-events:none;box-shadow:0 8px 30px #0008;animation:lessonpop 1s forwards}
.lesson .mini{display:flex;justify-content:center;gap:4px;margin:7px 0;flex-wrap:nowrap}.lesson .mini img{width:15%;max-width:57px}.lesson .math{font-size:clamp(16px,4.2vw,27px);font-weight:900}.lesson .converted{display:flex;justify-content:center;align-items:center;gap:12px;font-size:22px;font-weight:900}.lesson .converted img{width:23%;max-width:90px}
@keyframes lessonpop{0%{opacity:0;transform:scale(.75)}15%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
</style>
</head>
<body>
<div class="app">
  <div class="stats">
    <div>のこり時間<div class="num"><span id="time">60</span>秒</div></div>
    <div>あつめた おかね<div class="num"><span id="score">0</span>円</div></div>
  </div>
  <div id="modeLabel" class="mode-label">コースを えらんでね</div>
  <div id="board" class="board">
    <svg id="lines" viewBox="0 0 100 112.5" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1"></svg>
    <div id="coins"></div>
    <div id="overlay" class="overlay">
      <h1 id="heading">コインつなぎ</h1>
      <div id="result">すきなコースを えらぼう！</div>
      <div id="final" class="big hidden"></div>
      <div id="modeButtons" class="mode-buttons">
        <button class="mode-btn" data-mode="five">5まいコース<div class="rule">1円・10円・100円を 5まい</div></button>
        <button class="mode-btn second" data-mode="two">2まいコース<div class="rule">5円・50円・500円を 2まい</div></button>
      </div>
      <button id="again" class="again-btn hidden">もういちど！</button>
      <button id="menu" class="menu-btn hidden">コースを えらぶ</button>
    </div>
  </div>
  <div id="msg" class="msg">コースを えらんで スタート！</div>
  <div id="guide" class="guide">5まいコース と 2まいコースが あります</div>
</div>
<script>
(()=>{
const board=document.getElementById('board'),coins=document.getElementById('coins'),lines=document.getElementById('lines'),overlay=document.getElementById('overlay'),timeEl=document.getElementById('time'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg'),guide=document.getElementById('guide'),modeLabel=document.getElementById('modeLabel'),heading=document.getElementById('heading'),result=document.getElementById('result'),final=document.getElementById('final'),modeButtons=document.getElementById('modeButtons'),again=document.getElementById('again'),menu=document.getElementById('menu');
const C=8,R=9;
const MODES={
 five:{name:'5まいコース',values:[1,10,100],count:5,guide:'1円×5→5円　10円×5→50円　100円×5→500円'},
 two:{name:'2まいコース',values:[5,50,500],count:2,guide:'5円×2→10円　50円×2→100円　500円×2→1000円'}
};
let cells=[],sel=[],active=false,playing=false,busy=false,score=0,endAt=0,tick=null,epoch=0,currentKey=null,current=null;
const idx=(r,c)=>r*C+c,rc=i=>[Math.floor(i/C),i%C],rnd=()=>current.values[Math.floor(Math.random()*current.values.length)];
function neighbors(i){let [r,c]=rc(i),out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let y=r+dr,x=c+dc;if(y>=0&&y<R&&x>=0&&x<C)out.push(idx(y,x))}return out}
function hints(){if(!active||!sel.length||sel.length>=current.count)return[];let last=sel[sel.length-1];return neighbors(last).filter(i=>cells[i]===cells[last]&&!sel.includes(i))}
function draw(){let hs=new Set(current?hints():[]);coins.innerHTML='';cells.forEach((v,i)=>{if(v==null)return;let [r,c]=rc(i),el=document.createElement('div');el.className='coin v'+v+(sel.includes(i)?' sel':'')+(hs.has(i)?' hint':'');el.style.left=((c+.5)/C*100)+'%';el.style.top=((r+.5)/R*100)+'%';coins.appendChild(el)});let pts=sel.map(i=>{let [r,c]=rc(i);return `${(c+.5)/C*100},${(r+.5)/R*112.5}`}).join(' ');lines.innerHTML=pts?`<polyline points="${pts}" fill="none" stroke="#ffe35c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
function locate(e){let b=board.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;if(x<0||x>=1||y<0||y>=1)return-1;return idx(Math.floor(y*R),Math.floor(x*C))}
function add(i){if(i<0||cells[i]==null||sel.length>=current.count)return;if(!sel.length){sel=[i];draw();return}let last=sel[sel.length-1];if(i===last)return;if(sel.length>1&&i===sel[sel.length-2]){sel.pop();draw();return}if(sel.includes(i)||cells[i]!==cells[last]||!neighbors(last).includes(i))return;sel.push(i);draw()}
function finish(){if(!active)return;active=false;if(!playing){sel=[];draw();return}if(sel.length!==current.count){msg.textContent=`おなじコインを ${current.count}まい ぴったり つなげよう！`;sel=[];draw();return}busy=true;let base=cells[sel[0]],earned=base*current.count;score+=earned;scoreEl.textContent=score.toLocaleString('ja-JP');msg.textContent=`${base}円が ${current.count}まいで ${earned}円！`;let fx=document.createElement('div');fx.className='lesson';let convertedName=earned===1000?'1000円札':'円玉';fx.innerHTML=`<strong>${base}円玉 ${current.count}まい</strong><div class="mini">${Array(current.count).fill(`<img src="assets/${base}.png" alt="${base}円玉">`).join('')}</div><div class="math">${Array(current.count).fill(base).join(' ＋ ')} ＝ ${earned}円</div><div class="converted"><span>↓</span><img src="assets/${earned}.png" alt="${earned}円"><span>${earned}${convertedName==='円玉'?'円玉':'円札'} 1まい！</span></div>`;board.appendChild(fx);sel.forEach(i=>cells[i]=null);sel=[];draw();let myEpoch=epoch;setTimeout(()=>{if(myEpoch!==epoch){fx.remove();return}for(let c=0;c<C;c++){let stack=[];for(let r=R-1;r>=0;r--)if(cells[idx(r,c)]!==null)stack.push(cells[idx(r,c)]);for(let r=R-1;r>=0;r--)cells[idx(r,c)]=stack[R-1-r]??rnd()}fx.remove();busy=false;draw();if(!playing)showEnd()},1000)}
function showEnd(){overlay.classList.remove('hidden');heading.textContent='タイムアップ！';result.textContent='あつめた おかね';final.textContent=score.toLocaleString('ja-JP')+'円';final.classList.remove('hidden');modeButtons.classList.add('hidden');again.classList.remove('hidden');menu.classList.remove('hidden')}
function updateTime(){if(!playing)return;let remaining=Math.max(0,Math.ceil((endAt-performance.now())/1000));timeEl.textContent=remaining;if(performance.now()>=endAt){playing=false;clearInterval(tick);timeEl.textContent='0';if(!busy)showEnd()}}
function newGame(key=currentKey){currentKey=key;current=MODES[key];epoch++;clearInterval(tick);document.querySelectorAll('.lesson').forEach(x=>x.remove());score=0;scoreEl.textContent='0';timeEl.textContent='60';cells=Array.from({length:C*R},rnd);sel=[];active=false;busy=false;playing=true;endAt=performance.now()+60000;overlay.classList.add('hidden');modeLabel.textContent=current.name;msg.textContent=`おなじコインを ${current.count}まい ぴったり つなげよう！`;guide.textContent=current.guide;draw();tick=setInterval(updateTime,80)}
function showMenu(){epoch++;clearInterval(tick);playing=false;active=false;busy=false;current=null;currentKey=null;cells=[];sel=[];draw();timeEl.textContent='60';scoreEl.textContent='0';modeLabel.textContent='コースを えらんでね';msg.textContent='コースを えらんで スタート！';guide.textContent='5まいコース と 2まいコースが あります';heading.textContent='コインつなぎ';result.textContent='すきなコースを えらぼう！';final.classList.add('hidden');again.classList.add('hidden');menu.classList.add('hidden');modeButtons.classList.remove('hidden');overlay.classList.remove('hidden')}
['contextmenu','selectstart','dragstart'].forEach(type=>board.addEventListener(type,e=>{if(!e.target.closest('#overlay'))e.preventDefault()},{capture:true}));
board.addEventListener('touchstart',e=>{if(e.target.closest('#overlay'))return;if(e.cancelable)e.preventDefault()},{passive:false});
board.addEventListener('pointerdown',e=>{if(!playing||busy||e.target.closest('#overlay'))return;e.preventDefault();board.setPointerCapture(e.pointerId);active=true;sel=[];add(locate(e))});
board.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();add(locate(e))});
board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
modeButtons.addEventListener('click',e=>{let btn=e.target.closest('[data-mode]');if(btn)newGame(btn.dataset.mode)});again.addEventListener('click',()=>newGame());menu.addEventListener('click',showMenu);
showMenu();
})();
</script>
</body>
</html>
