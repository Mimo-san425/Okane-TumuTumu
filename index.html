<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>コインつなぎ 60秒</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #10213c;
      color: white;
      font-family: system-ui, sans-serif;
      touch-action: manipulation;
    }

    .app {
      max-width: 680px;
      margin: auto;
      padding: 12px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: #254569;
      border-radius: 14px;
      text-align: center;
    }

    .num {
      font-size: 30px;
      font-weight: 900;
    }

    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 8 / 9;
      margin-top: 10px;
      overflow: hidden;
      background: radial-gradient(#345b88, #122947);
      border: 3px solid #779ac0;
      border-radius: 15px;
      touch-action: none;
    }

    .coin {
      position: absolute;
      width: 11.5%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      box-shadow:
        inset 2px 2px 4px #fff9,
        inset -3px -3px 4px #0005,
        0 2px 5px #0006;
    }

    .coin.v1 {
      background-image: url("assets/1.png");
    }

    .coin.v10 {
      background-image: url("assets/10.png");
    }

    .coin.v100 {
      background-image: url("assets/100.png");
    }

    .coin.hint {
      box-shadow:
        0 0 0 4px #a7ff85,
        0 0 22px 7px #8eff69,
        inset 2px 2px 4px #fff9;
      animation: pulse 0.7s infinite alternate;
    }

    .coin.sel {
      z-index: 2;
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow:
        0 0 0 4px #ffdf45,
        0 0 19px #ffdf45;
    }

    @keyframes pulse {
      to {
        filter: brightness(1.45);
      }
    }

    button {
      padding: 13px 24px;
      background: #ffd54c;
      color: #3a2c0c;
      border: 0;
      border-radius: 12px;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #071629e9;
      text-align: center;
    }

    .overlay h1 {
      margin: 0;
      font-size: 36px;
    }

    .overlay .big {
      color: #ffdf55;
      font-size: 50px;
      font-weight: 900;
    }

    .hidden {
      display: none;
    }

    .msg {
      min-height: 28px;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    .guide {
      margin: 10px 0;
      color: #dce9ff;
      font-size: 13px;
      text-align: center;
    }

    /* 正解時のポップアップ */
    .lesson {
      position: absolute;
      top: 27%;
      left: 4%;
      z-index: 4;
      width: 92%;
      padding: 14px 8px;
      background: #fffdf1f5;
      color: #182b46;
      border: 4px solid #ffd34e;
      border-radius: 20px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 30px #0008;
      animation: lessonpop 1.8s forwards;
    }

    .lesson strong {
      display: block;
      font-size: clamp(19px, 5vw, 30px);
    }

    /* つないだ5枚の画像 */
    .lesson .mini {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 7px 0;
    }

    .lesson .mini img {
      display: block;
      width: 15%;
      max-width: 57px;
      height: auto;
      object-fit: contain;
    }

    .lesson .math {
      font-size: clamp(17px, 4.5vw, 28px);
      font-weight: 900;
    }

    /* 5倍後の画像 */
    .lesson .converted {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 900;
    }

    .lesson .converted img {
      display: block;
      width: 23%;
      max-width: 90px;
      height: auto;
      object-fit: contain;
    }

    @keyframes lessonpop {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }

      12% {
        opacity: 1;
        transform: scale(1);
      }

      82% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="stats">

      <div>
        のこり時間

        <div class="num">
          <span id="time">60</span>秒
        </div>
      </div>

      <div>
        あつめた おかね

        <div class="num">
          <span id="score">0</span>円
        </div>
      </div>

    </div>

    <div id="board" class="board">

      <svg
        id="lines"
        viewBox="0 0 100 112.5"
        preserveAspectRatio="none"
        style="
          position:absolute;
          inset:0;
          z-index:1;
          width:100%;
          height:100%;
          pointer-events:none;
        "
      ></svg>

      <div id="coins"></div>

      <div id="overlay" class="overlay">

        <h1 id="heading">
          コインつなぎ
        </h1>

        <div id="result">
          60秒で なん円 あつめられるかな？
        </div>

        <div id="final" class="big hidden"></div>

        <button id="start" type="button">
          スタート！
        </button>

      </div>

    </div>

    <div id="msg" class="msg">
      おなじコインを 5まい ぴったり つなげよう！
    </div>

    <div class="guide">
      1円×5→5円　10円×5→50円　100円×5→500円
    </div>

  </div>
  <script>
    (() => {
      const board = document.getElementById("board");
      const coins = document.getElementById("coins");
      const lines = document.getElementById("lines");
      const overlay = document.getElementById("overlay");
      const start = document.getElementById("start");
      const timeEl = document.getElementById("time");
      const scoreEl = document.getElementById("score");
      const msg = document.getElementById("msg");
      const heading = document.getElementById("heading");
      const result = document.getElementById("result");
      const final = document.getElementById("final");

      const C = 8;
      const R = 9;

      let cells = [];
      let sel = [];
      let active = false;
      let playing = false;
      let busy = false;
      let score = 0;
      let endAt = 0;
      let tick = null;
      let epoch = 0;

      const idx = (r, c) => r * C + c;

      const rc = i => [
        Math.floor(i / C),
        i % C
      ];

      const rnd = () => {
        const values = [1, 10, 100];
        return values[Math.floor(Math.random() * values.length)];
      };

      function neighbors(i) {
        const [r, c] = rc(i);
        const out = [];

        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) {
              continue;
            }

            const y = r + dr;
            const x = c + dc;

            if (
              y >= 0 &&
              y < R &&
              x >= 0 &&
              x < C
            ) {
              out.push(idx(y, x));
            }
          }
        }

        return out;
      }

      function hints() {
        if (
          !active ||
          sel.length === 0 ||
          sel.length >= 5
        ) {
          return [];
        }

        const last = sel.at(-1);

        return neighbors(last).filter(i => {
          return (
            cells[i] === cells[last] &&
            !sel.includes(i)
          );
        });
      }

      function draw() {
        const hs = new Set(hints());

        coins.innerHTML = "";

        cells.forEach((value, i) => {
          if (value === null) {
            return;
          }

          const [r, c] = rc(i);
          const coin = document.createElement("div");

          coin.className =
            "coin v" +
            value +
            (sel.includes(i) ? " sel" : "") +
            (hs.has(i) ? " hint" : "");

          coin.style.left =
            ((c + 0.5) / C * 100) + "%";

          coin.style.top =
            ((r + 0.5) / R * 100) + "%";

          coins.appendChild(coin);
        });

        const points = sel.map(i => {
          const [r, c] = rc(i);

          const x = (c + 0.5) / C * 100;
          const y = (r + 0.5) / R * 112.5;

          return `${x},${y}`;
        }).join(" ");

        if (points) {
          lines.innerHTML = `
            <polyline
              points="${points}"
              fill="none"
              stroke="#ffe35c"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          `;
        } else {
          lines.innerHTML = "";
        }
      }

      function locate(event) {
        const bounds = board.getBoundingClientRect();

        const x =
          (event.clientX - bounds.left) /
          bounds.width;

        const y =
          (event.clientY - bounds.top) /
          bounds.height;

        if (
          x < 0 ||
          x >= 1 ||
          y < 0 ||
          y >= 1
        ) {
          return -1;
        }

        return idx(
          Math.floor(y * R),
          Math.floor(x * C)
        );
      }

      function add(i) {
        if (
          i < 0 ||
          cells[i] === null
        ) {
          return;
        }

        if (sel.length === 0) {
          sel = [i];
          draw();
          return;
        }

        const last = sel.at(-1);

        if (i === last) {
          return;
        }

        if (
          sel.length > 1 &&
          i === sel.at(-2)
        ) {
          sel.pop();
          draw();
          return;
        }

        if (
          sel.includes(i) ||
          cells[i] !== cells[last] ||
          !neighbors(last).includes(i)
        ) {
          return;
        }

        if (sel.length >= 5) {
          return;
        }

        sel.push(i);
        draw();
      }

      function createCoinImages(value, count) {
        return Array.from(
          { length: count },
          () => `
            <img
              src="assets/${value}.png"
              alt="${value}円玉"
            >
          `
        ).join("");
      }

      function finish() {
        if (!active) {
          return;
        }

        active = false;

        if (!playing) {
          sel = [];
          draw();
          return;
        }

        if (sel.length !== 5) {
          msg.textContent =
            "5まい ぴったり つなげよう！";

          sel = [];
          draw();
          return;
        }

        busy = true;

        const base = cells[sel[0]];
        const earned = base * 5;

        score += earned;

        scoreEl.textContent =
          score.toLocaleString("ja-JP");

        msg.textContent =
          base +
          "円が 5まいで " +
          earned +
          "円！";

        const fx =
          document.createElement("div");

        fx.className = "lesson";

        /*
          ポップアップ内の画像

          1円をつないだ場合
          assets/1.pngを5枚
          assets/5.pngを1枚

          10円をつないだ場合
          assets/10.pngを5枚
          assets/50.pngを1枚

          100円をつないだ場合
          assets/100.pngを5枚
          assets/500.pngを1枚
        */
        fx.innerHTML = `
          <strong>
            ${base}円玉 5まい
          </strong>

          <div class="mini">
            ${createCoinImages(base, 5)}
          </div>

          <div class="math">
            ${Array(5).fill(base).join(" ＋ ")}
            ＝ ${earned}円
          </div>

          <div class="converted">
            <span>↓</span>

            <img
              src="assets/${earned}.png"
              alt="${earned}円玉"
            >

            <span>
              ${earned}円玉 1まい！
            </span>
          </div>
        `;

        board.appendChild(fx);

        sel.forEach(i => {
          cells[i] = null;
        });

        sel = [];
        draw();

        const myEpoch = epoch;

        setTimeout(() => {
          if (myEpoch !== epoch) {
            fx.remove();
            return;
          }

          for (let c = 0; c < C; c++) {
            const stack = [];

            for (let r = R - 1; r >= 0; r--) {
              const value = cells[idx(r, c)];

              if (value !== null) {
                stack.push(value);
              }
            }

            for (let r = R - 1; r >= 0; r--) {
              const stackPosition =
                R - 1 - r;

              cells[idx(r, c)] =
                stack[stackPosition] ?? rnd();
            }
          }

          fx.remove();
          busy = false;
          draw();

          if (!playing) {
            showEnd();
          }
        }, 1800);
      }

      function showEnd() {
        overlay.classList.remove("hidden");

        heading.textContent =
          "タイムアップ！";

        result.textContent =
          "あつめた おかね";

        final.textContent =
          score.toLocaleString("ja-JP") +
          "円";

        final.classList.remove("hidden");

        start.textContent =
          "もういちど！";
      }

      function updateTime() {
        if (!playing) {
          return;
        }

        const remaining = Math.max(
          0,
          Math.ceil(
            (endAt - performance.now()) /
            1000
          )
        );

        timeEl.textContent = remaining;

        if (
          performance.now() >= endAt
        ) {
          playing = false;

          clearInterval(tick);

          timeEl.textContent = "0";

          if (!busy) {
            showEnd();
          }
        }
      }

      function newGame() {
        epoch++;

        clearInterval(tick);

        document
          .querySelectorAll(".lesson")
          .forEach(element => {
            element.remove();
          });

        score = 0;

        scoreEl.textContent = "0";
        timeEl.textContent = "60";

        cells = Array.from(
          { length: C * R },
          rnd
        );

        sel = [];
        active = false;
        busy = false;
        playing = true;

        endAt =
          performance.now() + 60000;

        heading.textContent =
          "コインつなぎ";

        result.textContent =
          "60秒で なん円 あつめられるかな？";

        final.textContent = "";
        final.classList.add("hidden");

        start.textContent =
          "スタート！";

        overlay.classList.add("hidden");

        msg.textContent =
          "おなじコインを 5まい ぴったり つなげよう！";

        draw();

        tick = setInterval(
          updateTime,
          80
        );
      }

      board.addEventListener(
        "pointerdown",
        event => {
          if (
            !playing ||
            busy
          ) {
            return;
          }

          event.preventDefault();

          board.setPointerCapture(
            event.pointerId
          );

          active = true;
          sel = [];

          add(locate(event));
        }
      );

      board.addEventListener(
        "pointermove",
        event => {
          if (!active) {
            return;
          }

          event.preventDefault();

          add(locate(event));
        }
      );

      board.addEventListener(
        "pointerup",
        finish
      );

      board.addEventListener(
        "pointercancel",
        finish
      );

      start.addEventListener(
        "click",
        newGame
      );

      cells = Array.from(
        { length: C * R },
        rnd
      );

      draw();
    })();
  </script>

</body>
</html>
